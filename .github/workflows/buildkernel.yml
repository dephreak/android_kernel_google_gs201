name: Build Sultan GS201 Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - 16.0.0-sultan

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: 16.0.0-sultan

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev \
            libc6-dev libncurses5-dev \
            ccache git python3 \
            build-essential \
            dwarves \
            lz4 rsync

      - name: Fetch Android kernel build scripts
        run: |
          echo "Cloning kernel/build into ./build ..."
          git clone https://android.googlesource.com/kernel/build build
          echo "Contents of ./build:"
          ls -R build || true
          echo "Check for build/build.sh:"
          if [ -f build/build.sh ]; then
            echo "build/build.sh found ✅"
          else
            echo "build/build.sh is missing ❌"
            exit 1
          fi

      - name: Build kernel (GKI aarch64)
        env:
          LTO: thin
          BUILD_CONFIG: build.config.gki.aarch64
        run: |
          ls -R .
          echo "Making build.sh executable..."
          chmod +x build/build.sh
          echo "Running build.sh..."
          ./build/build.sh -j$(nproc) V=1

      - name: List build outputs
        run: |
          echo "==== dist/ ===="
          ls -R dist || echo "no dist dir"
          echo "==== out/ ===="
          ls -R out || echo "no out dir"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sultan-gs201-kernel-dist
          path: |
            dist/**
            out/**/dist/**
