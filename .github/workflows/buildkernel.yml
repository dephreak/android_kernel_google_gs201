name: Build Sultan GS201 Kernel (plain make)

on:
  workflow_dispatch:
  push:
    branches:
      - 16.0.0-sultan

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: 16.0.0-sultan

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            make clang lld llvm \
            git bc flex bison gawk \
            lz4 cpio xz-utils \
            libssl-dev libelf-dev libdw-dev \
            libc6-dev-amd64-cross \
            libncurses5-dev libncurses-dev \
            pahole

      - name: Show clang version
        run: |
          clang --version || true
          llvm-ar --version || true

      - name: Configure kernel (gki_defconfig)
        run: |
          mkdir -p out
          make LLVM=1 ARCH=arm64 O=out gki_defconfig

      - name: Build kernel
        run: |
          make LLVM=1 ARCH=arm64 O=out -j$(nproc)

      - name: Collect build outputs
        run: |
          mkdir -p dist
          # Copy common arm64 kernel images if they exist
          cp out/arch/arm64/boot/Image* dist/ 2>/dev/null || true
          echo "=== dist/ ==="
          ls -R dist || echo "dist is empty"
          echo "=== out/arch/arm64/boot ==="
          ls -R out/arch/arm64/boot || echo "boot dir missing"

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sultan-gs201-kernel-make
          path: |
            dist/**
            out/arch/arm64/boot/**
