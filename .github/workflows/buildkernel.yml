name: Build Sultan GS201 Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - 16.0.0-sultan

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: 16.0.0-sultan

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev \
            libc6-dev libncurses5-dev \
            ccache git python3 \
            build-essential \
            dwarves \
            lz4 rsync

      - name: Fetch Android kernel build scripts
        run: |
          # clone Google's kernel/build repo into ./build
          git clone https://android.googlesource.com/kernel/build build
          ls build

      - name: Build kernel (GKI aarch64)
        env:
          LTO: thin
          # our build.config.gki.aarch64 is at repo root, not under common/
          BUILD_CONFIG: build.config.gki.aarch64
        run: |
          chmod +x build/build.sh
          ./build/build.sh -j$(nproc) V=1

      - name: List build outputs
        run: |
          echo "==== dist/ ===="
          ls -R dist || echo "no dist dir"
          echo "==== out/ ===="
          ls -R out || echo "no out dir"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sultan-gs201-kernel-dist
          path: |
            dist/**
            out/**/dist/**
